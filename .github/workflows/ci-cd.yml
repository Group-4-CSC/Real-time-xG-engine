name: xG Insights CI/CD

on:
  push:
  pull_request:
    branches: [main]

# Pull requests receive read-only permissions, no deployment credentials.
permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify runtimes and manifests
        run: |
          python --version
          node --version
          test -f football-xg-backend/requirements.txt
          test -f Analytics/requirements-ml.txt
          test -f frontend/package-lock.json

  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            football-xg-backend/requirements.txt
            Analytics/requirements-ml.txt
            pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies (editable path requires backend directory)
        working-directory: football-xg-backend
        run: python -m pip install -r requirements.txt -r ../requirements.txt -r ../Analytics/requirements-ml.txt
      - run: python -m pip check
      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci

  test:
    name: Test
    if: ${{ always() }}
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fail the required check if prerequisites failed or were cancelled
        if: needs.dependencies.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            football-xg-backend/requirements.txt
            Analytics/requirements-ml.txt
            pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Jobs have separate filesystems: caches are downloads, not installations.
      - name: Install this job's Python dependencies
        working-directory: football-xg-backend
        run: python -m pip install -r requirements.txt -r ../requirements.txt -r ../Analytics/requirements-ml.txt
      - run: python -m pip check
      - name: Install this job's frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Scan source and Git history for credentials
        run: bash scripts/scan-secrets.sh
      - name: Analytics unit and story acceptance tests
        run: python -m unittest discover -s Analytics -p 'test_*.py' -v
      - name: Real dataset smoke check
        run: python -m Analytics.data_smoke_check
      - name: Django API integration tests
        working-directory: football-xg-backend
        run: |
          python manage.py check
          python manage.py test api --verbosity 2
      - name: Frontend acceptance tests and lint
        working-directory: frontend
        run: |
          npm run test
          npm run lint
      - name: Build the Pages demo with its repository base path
        working-directory: frontend
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
      - name: Upload tested Pages artifact (trusted main pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - name: Deploy the tested frontend artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
